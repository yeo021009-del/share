[pytest]
testpaths = tests
addopts = -q --strict-markers -m "not realphoto"
markers =
    realphoto: 실사진 3장에 모델을 실제로 돌린다 (사진당 ~1분).
        기본 실행에서는 제외되고 30회 반복도 빨리 끝난다.
        돌리려면:  pytest -m realphoto
filterwarnings =
    # starlette 의 TestClient 가 httpx 를 쓴다는 라이브러리 내부 안내 — 우리 코드와 무관
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    # backend/exif_utils.py 가 import 시점에 거는 필터와 동일.
    # pytest 는 테스트마다 경고 필터를 초기화하므로 여기에도 적어 줘야 한다.
    # (테스트용 piexif JPEG 의 Exif sub-IFD 에 next-IFD 포인터가 없어서 나는 경고로,
    #  태그 자체는 정상 파싱된다 — TestExif 가 그 값을 검증한다.)
    ignore:Corrupt EXIF data:UserWarning
